services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      # 5433 снаружи, чтобы не конфликтовать с локальным Postgres на 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      # Внутри сети compose база доступна по имени сервиса и порту 5432.
      DATABASE_URL: postgresql+asyncpg://payments:payments@db:5432/payments
      # Значение для разработки. В реальной среде задайте свой: WEBHOOK_SECRET=... docker compose up
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
